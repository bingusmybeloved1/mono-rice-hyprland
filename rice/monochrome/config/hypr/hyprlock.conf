general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}
background {
    color = rgb(080808)
}
input-field {
    monitor =
    size = 320, 42
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(777777)
    inner_color = rgb(101010)
    font_color = rgb(e6e6e6)
    fade_on_empty = false
    placeholder_text = <span foreground="##888888">Password</span>
    check_color = rgb(b0b0b0)
    fail_color = rgb(aaaaaa)
    rounding = 0
    position = 0, -40
    halign = center
    valign = center
}
label {
    monitor =
    text = $TIME
    color = rgb(e6e6e6)
    font_size = 28
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}
label {
    monitor =
    text = $USER
    color = rgb(aaaaaa)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, 25
    halign = center
    valign = center
}
