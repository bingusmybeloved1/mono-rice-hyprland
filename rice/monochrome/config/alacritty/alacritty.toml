[window]
decorations = "full"
opacity = 1.0
padding = { x = 6, y = 4 }

[font]
size = 9.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[colors.primary]
background = "#080808"
foreground = "#e6e6e6"

[colors.cursor]
text = "#080808"
cursor = "#e6e6e6"

[colors.selection]
text = "#ffffff"
background = "#404040"

[colors.normal]
black = "#080808"
red = "#a0a0a0"
green = "#b0b0b0"
yellow = "#c0c0c0"
blue = "#909090"
magenta = "#a8a8a8"
cyan = "#b8b8b8"
white = "#d8d8d8"

[colors.bright]
black = "#555555"
red = "#b0b0b0"
green = "#c0c0c0"
yellow = "#d0d0d0"
blue = "#a0a0a0"
magenta = "#b8b8b8"
cyan = "#d0d0d0"
white = "#ffffff"
